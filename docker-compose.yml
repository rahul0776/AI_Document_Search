version: '3.8'

services:
  # Backend API (FastAPI + Uvicorn)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Load from .env file
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-devsecret}
      - AUTH_JWT_ISS=${AUTH_JWT_ISS:-rag-app}
      - DEV_NO_AUTH=${DEV_NO_AUTH:-0}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL:-text-embedding-3-small}
      - CHAT_MODEL=${CHAT_MODEL:-gpt-4o-mini}
      - OPENAI_TIMEOUT_S=${OPENAI_TIMEOUT_S:-45}
      - OPENAI_RETRIES=${OPENAI_RETRIES:-3}
      - INDEX_DIR=/app/data/index
      - UPLOAD_DIR=/app/data/uploads
      - MAX_PDF_MB=${MAX_PDF_MB:-40}
      - MAX_PAGES=${MAX_PAGES:-2000}
      - MAX_CHUNKS_PER_DOC=${MAX_CHUNKS_PER_DOC:-3}
      - TOP_K_DEFAULT=${TOP_K_DEFAULT:-5}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=${WORKERS:-1}
    volumes:
      # Persist uploads and indexes
      - ./backend/data/uploads:/app/data/uploads
      - ./backend/data/index:/app/data/index
      - ./backend/data/logs:/app/data/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag-network

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE=${REACT_APP_API_BASE:-http://localhost:8000}
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rag-network

  # Nginx reverse proxy (optional - for production)
  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # Mount SSL certificates if needed
    depends_on:
      - backend
      - frontend
    networks:
      - rag-network
    profiles:
      - production  # Only start with --profile production

networks:
  rag-network:
    driver: bridge

volumes:
  # Named volumes for better management
  uploads:
  indexes:
  logs:

