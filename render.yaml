services:
  - type: web
    name: ai-doc-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: DEV_NO_AUTH
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.0"

